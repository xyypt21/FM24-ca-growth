# FM24 offsets. When the game version changes, update this file only.
# Values may be written in hexadecimal (0x...) and are parsed as integers.
#
# Two kinds of offsets, with different meanings:
#   RVA         exe base + RVA    -> address of a global variable
#   field offset object + offset  -> a field inside that object

# Game version, informational only (not used by the logic).
game_version = "24.4.2+2081827"

# Process name: only fm.exe is accepted (case-insensitive).
process_name = "fm.exe"


[manager]
# RVA: exe + value -> global variable holding the manager container address.
container_rva = 0x6365118
# Field offset: container + value -> array begin (one element: the human manager).
vector_off = 0x18
# Field offset: manager record + value -> person sub-object.
person_off = 0x450


[person]
# Field offset: person + value -> UID (u32).
# In player records this field is at record + 0x284, which is person offset
# 0x278 + 0xC.
uid_off = 0x0C
# Field offset: person + value -> contract pointer.
contract_off = 0xC8
# Birth date is stored as two u16 values: day of the year and year.
birth_doy = 0x44
birth_year = 0x46
# Field offsets: name holder pointers. Follow up to 3 pointers, then read the
# string as [u32 length][utf-8].
first_name = 0x58
last_name = 0x60
short_name = 0x68


[contract]
# Field offset: contract + value -> managed team pointer.
team_off = 0x10


[team]
# Field offset: team + value -> UID (u32).
# The first team can share the club UID; youth teams have their own UID.
uid_off = 0x0C
# Field offset: team + value -> club pointer.
club_off = 0x30
# Field offset: team + value -> player record pointer array begin (end at +0x40).
roster_begin = 0x38


[club]
# Field offset: club + value -> owned teams array begin (end is at +0x20).
# Usually the first team, reserves, U19, and U18.
teams_begin = 0x18
# Field offset: club + value -> linked teams array begin (end is at +0x38).
# The B team lives under another club entry and is linked from here.
linked_teams_begin = 0x30


[player]
# Field offsets: current ability and potential ability (u16) in the record.
ca = 0x200
pa = 0x202
# Read this many bytes at once: it must cover the last name pointer in the
# furthest person sub-object (0x368 + 0x68 + 8).
record_read = 0x3D8


# Record type tag -> person sub-object offset. The 4-byte tag at the start of a
# player record selects the layout. It is a type tag, not a pointer.
#   0x45A4E958 -> normal player record, person at +0x278
#   0x45C7E798 -> player who is also staff, person at +0x368
# Records with any other tag (for example 0x45C7D028) are not player records
# (or are unreadable) and are skipped.
[player.layouts]
"0x45A4E958" = 0x278
"0x45C7E798" = 0x368


[game_date]
# RVA: exe + value -> in-game date, u32 = (year << 16) | (time byte << 8) | day
# of the year. Ages are calculated from this date, not from the system clock.
rva = 0x631D5BC


[read]
# Valid pointer range. The lowest allocatable user-mode address on Windows x64
# is 64 KB; the upper bound stays below the canonical limit 0x7FFFFFFFFFFF so
# real game pointers are never rejected.
min_ptr = 0x10000
max_ptr = 0x7FF000000000
# Name strings: [u32 length][utf-8]. Read this many bytes at once and reject
# lengths at or above name_max.
name_buf = 132
name_max = 120
