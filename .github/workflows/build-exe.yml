name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymem pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build GUI exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --collect-submodules pymem `
            --name FM24CAGrowth `
            src/fm24_ca_growth_gui.pyw
          Copy-Item src/offsets.toml dist/offsets.toml
          Copy-Item src/config.json dist/config.json

      - name: Package
        run: |
          Compress-Archive `
            -Path dist/FM24CAGrowth.exe,dist/offsets.toml,dist/config.json `
            -DestinationPath dist/FM24CAGrowth-windows.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM24CAGrowth-windows
          path: dist/FM24CAGrowth-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FM24CAGrowth-windows.zip
